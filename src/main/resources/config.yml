settings:
  # Waktu tunggu (detik) sebelum pemain berpindah setelah di-accept.
  # Isi 0 jika ingin langsung teleport tanpa jeda.
  teleport-delay: 3

  # Batas waktu (detik) permintaan TPA kedaluwarsa jika tidak direspon.
  request-expire: 60

  # Batalkan teleportasi jika pengirim TPA bergerak saat masa tunggu (teleport-delay)?
  cancel-on-move: false

  # Pastikan tidak ada kebal damage (NoDamageTicks = 0) setelah teleportasi
  instant-pvp-vulnerable: true

