  request-here-received: "&e%player% &amemintamu teleport ke lokasinya. Ketik &6/tpaccept &auntuk menerima."
  no-pending: "&cKamu tidak memiliki permintaan TPA yang aktif."
  request-expired: "&cPermintaan TPA telah kedaluwarsa."
